<text x="290" y="185" text-anchor="middle" font-size="11" fill="var(--ink2)">Dez</text>
<a href="#/text/arzt/stadt/1"><text x="330" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Clausthal</text></a>
<a href="#/text/arzt/stadt/6"><text x="330" y="340" text-anchor="middle" font-size="11" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">rund 7000–8000 Einwohner</text></a>
<a href="#/text/arzt/stadt/6"><text x="330" y="356" text-anchor="middle" font-size="11" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">700–800 Frauen mehr</text></a>
<a href="#/text/arzt/stadt/2"><text x="16" y="150" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink2)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Schnee bis April und Mai</text></a>
<a href="#/text/arzt/stadt/1"><text x="16" y="300" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Dürre 1781:</text></a>
<a href="#/text/arzt/stadt/1"><text x="16" y="316" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">die Brunnen versiegen</text></a>
<a href="#/text/arzt/stadt/2"><text x="16" y="470" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Herbst: Krankheiten</text></a>
<a href="#/text/arzt/stadt/2"><text x="16" y="486" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚gelinder‘</text></a>
<a href="#/text/arzt/stadt/2"><text x="496" y="250" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Frühjahr: Husten,</text></a>
<a href="#/text/arzt/stadt/3"><text x="496" y="266" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Rheuma, Ostwind</text></a>
<a href="#/text/arzt/stadt/3"><text x="496" y="282" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">vom Brocken</text></a>
<a href="#/text/arzt/stadt/2"><text x="490" y="420" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--wald)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Juni: Wildkräuter,</text></a>
<a href="#/text/arzt/stadt/2"><text x="490" y="436" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--wald)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Juli: Möhren</text></a>
<a href="#/text/arzt/stadt/4"><text x="330" y="514" text-anchor="middle" font-size="11.5" font-weight="normal" fill="var(--wald)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Heidelbeerzeit, ‚die gesundeste im Jahre‘</text></a>
<rect x="654" y="76" width="236" height="520" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
<text x="668" y="102" font-size="14" font-weight="bold" fill="var(--ink)">Was die Arbeit dem Körper tat</text>
<a href="#/text/arzt/stadt/6"><text x="668" y="140" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Pochknaben</text></a>
<a href="#/text/arzt/stadt/6"><text x="680" y="158" text-anchor="start" font-size="12" font-weight="normal" fill="var(--bergleute)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Krämpfe, ‚Würmer‘, Ausschlag</text></a>
<a href="#/text/arzt/stadt/6"><text x="668" y="188" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚Die Beschäftigung‘</text></a>
<a href="#/text/arzt/stadt/6"><text x="680" y="206" text-anchor="start" font-size="12" font-weight="normal" fill="var(--bergleute)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Husten, Tuberkel, Schwindsucht</text></a>
<a href="#/text/arzt/arbeit/1"><text x="668" y="236" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Hüttenleute</text></a>
<a href="#/text/arzt/arbeit/1"><text x="680" y="254" text-anchor="start" font-size="12" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚Hüttenkatze‘: Blei, Koliken</text></a>
<a href="#/text/arzt/arbeit/3"><text x="680" y="276" text-anchor="start" font-size="12" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Lähmung der Hände, Muskelschwund</text></a>
<a href="#/text/arzt/arbeit/3"><text x="680" y="298" text-anchor="start" font-size="12" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Kur in Gittelde, zurück auf die Hütte</text></a>
<a href="#/text/arzt/arbeit/5"><text x="668" y="328" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Bergleute</text></a>
<a href="#/text/arzt/arbeit/5"><text x="680" y="346" text-anchor="start" font-size="12" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚Fallen, Stoßen, Quetschen‘</text></a>
<a href="#/text/arzt/arbeit/4"><text x="680" y="368" text-anchor="start" font-size="12" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚ein großes Stück Berg‘: tot</text></a>
<a href="#/text/arzt/arbeit/6"><text x="680" y="390" text-anchor="start" font-size="12" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Quecksilbermittel: tot</text></a>
<a href="#/text/arzt/stadt/5"><text x="668" y="420" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Frauen</text></a>
<a href="#/text/arzt/stadt/5"><text x="680" y="438" text-anchor="start" font-size="12" font-weight="normal" fill="var(--bergleute)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Lasten tragen, Fehlgeburten</text></a>
<a href="#/text/arzt/arbeit/6"><text x="668" y="468" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Alle Kranken</text></a>
<a href="#/text/arzt/arbeit/6"><text x="680" y="486" text-anchor="start" font-size="12" font-weight="normal" fill="var(--wald)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚freyen Arzneygebrauch‘</text></a>
<text x="668" y="582" font-size="10.5" fill="var(--ink2)">Zahlen der Verunglückten: keine.</text>
<text x="16" y="626" font-size="11.5" fill="var(--ink2)">Grau: Schnee; grün: frische Nahrung, dunkler die Heidelbeerzeit; rot: Frühjahrskrankheiten. Monatsgrenzen nach Lentins Worten, ungefähr.</text>
</svg>