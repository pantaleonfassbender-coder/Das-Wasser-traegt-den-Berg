<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="sy-t sy-d" font-family="var(--serif)">
<title id="sy-t">Fünf Stollen übereinander</title>
<desc id="sy-d">Links ein maßstäblicher Schnitt durch den Schacht der Grube Caroline bei Clausthal. Von oben nach unten liegen die Stollen, die dort Tiefe einbringen: Frankenscharner Stollen 38 Lachter, Mitte des 16. Jahrhunderts; Neunzehn-Lachter-Stollen etwa 60 Lachter, 1535 bis 1685; Dreizehn-Lachter-Stollen 73 Lachter, 1526 wieder aufgenommen, 1693 zum Burgstätter Zug; Tiefer Georg-Stollen 149 Lachter, 1777 bis 1799; Ernst-August-Stollen 204 Lachter, 1851 bis 1864; darunter die Tiefste Wasserstrecke in 324 Lachter, 118 Fuß unter dem Meeresspiegel, 1868 im Bau. Rechts die Zahlen des Systems: 67 Teiche mit 382 Millionen Kubikfuß, 106 246 Lachter Gräben, 193 Wasserräder und 3 Wassersäulenmaschinen mit 2869 Pferdestärken, 14 bis 16 Wochen ohne Regen.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Fünf Stollen übereinander</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Nach Dumreicher (1868). Teufe an der Grube Caroline in Lachtern, maßstäblich; ein Lachter ist rund zwei Meter.</text>
<line x1="40" y1="90" x2="420" y2="90" stroke="var(--ink2)" stroke-width="1.5"/>
<a href="#/text/system/tiefe/3"><text x="40" y="82" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Tage: Hängebank der Grube Caroline</text></a>
<rect x="136" y="90" width="28" height="502" fill="var(--panel)" stroke="var(--ink2)" stroke-width="1.2"/>
<line x1="164" y1="149" x2="440" y2="149" stroke="var(--ink2)" stroke-width="2.4"/>
<line x1="136" y1="149" x2="110" y2="149" stroke="var(--ink2)" stroke-width="1"/>
<text x="106" y="153" text-anchor="end" font-size="11" fill="var(--ink2)">38 L.</text>
<a href="#/text/system/tiefe/1"><text x="172" y="143" text-anchor="start" font-size="12" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Frankenscharner Stollen, Mitte 16. Jh.</text></a>
<line x1="164" y1="183" x2="440" y2="183" stroke="var(--ink2)" stroke-width="2.4"/>
<line x1="136" y1="183" x2="110" y2="183" stroke="var(--ink2)" stroke-width="1"/>
<text x="106" y="187" text-anchor="end" font-size="11" fill="var(--ink2)">60 L.</text>
<a href="#/text/system/tiefe/1"><text x="172" y="195" text-anchor="start" font-size="12" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Neunzehn-Lachter-Stollen, 1535–1685</text></a>
<line x1="164" y1="203" x2="440" y2="203" stroke="var(--ink2)" stroke-width="2.4"/>
<line x1="136" y1="203" x2="110" y2="203" stroke="var(--ink2)" stroke-width="1"/>
<text x="106" y="207" text-anchor="end" font-size="11" fill="var(--ink2)">73 L.</text>
<a href="#/text/system/tiefe/1"><text x="172" y="217" text-anchor="start" font-size="12" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Dreizehn-Lachter-Stollen, 1526–1693</text></a>
<line x1="164" y1="321" x2="440" y2="321" stroke="var(--wasser)" stroke-width="4"/>
<line x1="136" y1="321" x2="110" y2="321" stroke="var(--wasser)" stroke-width="1"/>
<text x="106" y="325" text-anchor="end" font-size="11" fill="var(--ink2)">149 L.</text>
<a href="#/text/system/tiefe/3"><text x="172" y="315" text-anchor="start" font-size="12" font-weight="bold" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Tiefer Georg-Stollen, 26. 7. 1777 – 5. 9. 1799</text></a>
<line x1="164" y1="406" x2="440" y2="406" stroke="var(--wasser)" stroke-width="4"/>
<line x1="136" y1="406" x2="110" y2="406" stroke="var(--wasser)" stroke-width="1"/>
<text x="106" y="410" text-anchor="end" font-size="11" fill="var(--ink2)">204 L.</text>
<a href="#/text/system/tiefe/4"><text x="172" y="400" text-anchor="start" font-size="12" font-weight="bold" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Ernst-August-Stollen, 21. 7. 1851 – 22. 6. 1864</text></a>
<line x1="164" y1="592" x2="440" y2="592" stroke="var(--red)" stroke-width="2.4" stroke-dasharray="6 4"/>
<line x1="136" y1="592" x2="110" y2="592" stroke="var(--red)" stroke-width="1"/>
<text x="106" y="596" text-anchor="end" font-size="11" fill="var(--ink2)">324 L.</text>
<a href="#/text/system/tiefe/2"><text x="172" y="584" text-anchor="start" font-size="12" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Tiefste Wasserstrecke, 1868 im Bau</text></a>
<a href="#/text/system/tiefe/1"><text x="172" y="496" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink2)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚nimmermehr‘ ein tieferer</text></a>
<a href="#/text/system/tiefe/1"><text x="172" y="511" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink2)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">zu Tage geleiteter Stollen</text></a>
<path d="M 360 347 q 20 0 40 0" stroke="var(--wasser)" stroke-width="0" />
<a href="#/text/system/tiefe/2"><text x="172" y="426" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">auf gleicher Höhe die Tiefe Wasserstrecke: Kähne,</text></a>
<a href="#/text/system/tiefe/2"><text x="172" y="441" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚1300 Fuß unter der Stadt Clausthal‘</text></a>
<rect x="500" y="80" width="384" height="520" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
<text x="518" y="108" font-size="14.5" font-weight="bold" fill="var(--ink)">Das System 1868</text>
<a href="#/text/system/anlage/1"><text x="518" y="140" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">67 Teiche</text></a>
<a href="#/text/system/anlage/1"><text x="518" y="157" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">382 Millionen Kubikfuß, 936 Morgen</text></a>
<a href="#/text/system/anlage/1"><text x="518" y="190" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">27½ Meilen Gräben</text></a>
<a href="#/text/system/anlage/1"><text x="518" y="207" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Sammel- und Aufschlaggräben, Röschen</text></a>
<a href="#/text/system/anlage/5"><text x="518" y="240" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--wasser)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Dammgraben</text></a>
<a href="#/text/system/anlage/5"><text x="518" y="257" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚der eigentliche Lebensnerv‘, seit 1732</text></a>
<a href="#/text/system/anlage/3"><text x="518" y="290" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">14 bis 16 Wochen</text></a>
<a href="#/text/system/anlage/3"><text x="518" y="307" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">ohne Regen; 1857 der letzte Teich leer</text></a>
<a href="#/text/system/raeder/1"><text x="518" y="340" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--bergamt)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">193 Wasserräder</text></a>
<a href="#/text/system/raeder/1"><text x="518" y="357" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">aus Fichtenholz, dazu 3 Wassersäulenmaschinen</text></a>
<a href="#/text/system/raeder/2"><text x="518" y="390" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--bergamt)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">2869 Pferdestärken</text></a>
<a href="#/text/system/raeder/2"><text x="518" y="407" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">brutto, Rad für Rad nachgerechnet</text></a>
<a href="#/text/system/anlage/4"><text x="518" y="440" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">‚Rad Wasser‘</text></a>
<a href="#/text/system/anlage/4"><text x="518" y="457" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">die alte Einheit: ‚Gefühlssache‘</text></a>
<a href="#/text/system/fahrkunst/1"><text x="518" y="490" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--bergleute)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Fahrkunst 1833, Drahtseil 1834</text></a>
<a href="#/text/system/fahrkunst/1"><text x="518" y="507" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">statt Leitern und Ketten</text></a>
<a href="#/text/system/fahrkunst/3"><text x="518" y="540" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--bergleute)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Pochknabe mit 10, Bergmann mit 26</text></a>
<a href="#/text/system/fahrkunst/3"><text x="518" y="557" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">8 Gutegroschen die Woche</text></a>
<a href="#/text/system/tiefe/2"><text x="172" y="608" text-anchor="start" font-size="11.5" font-weight="normal" fill="var(--red)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">118 Fuß unter dem Spiegel der Nordsee</text></a>
<text x="16" y="640" font-size="11.5" fill="var(--ink2)">Frühe Jahreszahlen der oberen Stollen nach Dumreicher, der Calvör folgt; der Frankenscharner Stollen ist ‚nicht der älteste in seinem Angriffe‘.</text>
</svg>